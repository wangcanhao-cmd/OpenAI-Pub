<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>率土之滨 · 我的卡池</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:14px}
.app{max-width:720px;margin:0 auto}
h1{font-size:23px;margin:0 0 5px}
.sub{font-size:13px;color:#666;line-height:1.5;margin-bottom:12px}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.badge{background:#fff;border:1px solid #e1e4e8;border-radius:999px;padding:7px 10px;font-size:13px}
button{border:1px solid #d5d8dc;background:#fff;border-radius:9px;padding:8px 11px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.card{background:#fff;border:1px solid #e4e6e8;border-radius:11px;padding:10px 11px;min-width:0}
.top{display:flex;align-items:center;gap:8px}
.num{font-size:12px;color:#777;width:25px;flex:none}
.name{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:12px;color:#b42318;margin-top:5px;padding-left:33px}
.footer{font-size:12px;color:#777;margin:14px 2px;line-height:1.55}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<h1>率土之滨 · 我的卡池</h1>
<div class="sub">数据源：GitHub 公开仓库 <code>OpenAI-Pub/lutu-card-pool/cards.json</code>。此页面每次打开都会读取仓库里的最新卡池。</div>
<div class="bar">
  <div class="badge" id="count">读取中…</div>
  <div class="badge" id="updated">更新时间：—</div>
  <button id="copy">复制为文字</button>
</div>
<div class="grid" id="list"></div>
<div class="footer">以后卡池更新后，只要更新同目录的 <code>cards.json</code>，这个页面和 ChatGPT 读取到的版本就保持一致。</div>
</div>
<script>
let current=null;
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
async function load(){
  const r=await fetch('./cards.json?ts='+Date.now(),{cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json(); current=j;
  document.getElementById('count').textContent='已拥有 '+j.cards.length+' 张';
  document.getElementById('updated').textContent='更新时间：'+(j.updatedAt||'—');
  document.getElementById('list').innerHTML=j.cards.map(c=>`
    <div class="card">
      <div class="top"><span class="num">${String(c.id).padStart(2,'0')}</span><span class="name">${esc(c.name)}</span></div>
      ${c.note?'<div class="note">'+esc(c.note)+'</div>':''}
    </div>`).join('');
}
document.getElementById('copy').onclick=async()=>{
  if(!current)return;
  const text=current.cards.map(c=>`[x] ${String(c.id).padStart(2,'0')} ${c.name}${c.note?' — '+c.note:''}`).join('\n');
  try{await navigator.clipboard.writeText(text);alert('已复制')}catch(e){prompt('复制下面文字：',text)}
};
load().catch(e=>{document.getElementById('count').textContent='读取失败：'+e.message});
</script>
</body>
</html>
