name: Sync Study Mississippi institution logos

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-study-mississippi-institution-logos.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser and image tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/institution-logo-sync
          cd /tmp/institution-logo-sync
          npm init -y >/dev/null 2>&1
          npm install playwright sharp >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Capture official institution logos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p study-mississippi/assets/institutions

          cat > /tmp/institution-logo-sync/sync.mjs <<'EOF'
          import { chromium } from "playwright";
          import sharp from "sharp";
          import fs from "node:fs/promises";

          process.chdir(process.env.GITHUB_WORKSPACE);

          // Compact/stacked institutional marks are preferred for the member-card layout.
          // Three user-selected marks (MC, MVSU, Meridian) are intentionally pinned and
          // omitted from this crawler so they are never overwritten.
          const targets = [
            {
              slug:"alcorn-state-university",
              name:"Alcorn State University",
              home:"https://www.alcorn.edu/",
              pages:["https://www.alcorn.edu/marketing-and-communication/"]
            },
            {
              slug:"belhaven-university",
              name:"Belhaven University",
              home:"https://www.belhaven.edu/",
              pages:["https://www.belhaven.edu/about/contact/logos-branding.html"]
            },
            {
              slug:"blue-mountain-christian-university",
              name:"Blue Mountain Christian University",
              home:"https://www.bmc.edu/",
              pages:["https://www.bmc.edu/"]
            },
            {
              slug:"delta-state-university",
              name:"Delta State University",
              home:"https://www.deltastate.edu/",
              pages:["https://www.deltastate.edu/communications-and-marketing/"]
            },
            {
              slug:"jackson-state-university",
              name:"Jackson State University",
              home:"https://www.jsums.edu/",
              pages:["https://www.jsums.edu/universitycommunications/jsu-logo/"]
            },
            {
              slug:"millsaps-college",
              name:"Millsaps College",
              home:"https://millsaps.edu/",
              pages:["https://millsaps.edu/"]
            },
            {
              slug:"mississippi-state-university",
              name:"Mississippi State University",
              home:"https://www.msstate.edu/",
              pages:["https://www.brand.msstate.edu/assets/index.php","https://www.brand.msstate.edu/identity/index.php"]
            },
            {
              slug:"mississippi-university-for-women",
              name:"Mississippi University for Women",
              home:"https://www.muw.edu/",
              pages:["https://www.muw.edu/ur/branding/logos-wordmarks/"]
            },
            {
              slug:"the-piney-woods-school",
              name:"The Piney Woods School",
              home:"https://www.pineywoods.org/",
              pages:["https://www.pineywoods.org/"]
            },
            {
              slug:"st-andrews-episcopal-school",
              name:"St. Andrew's Episcopal School",
              home:"https://www.gosaints.org/",
              pages:["https://www.gosaints.org/"]
            },
            {
              slug:"tougaloo-college",
              name:"Tougaloo College",
              home:"https://www.tougaloo.edu/",
              pages:["https://www.tougaloo.edu/about-tougaloo-college/communications","https://www.tougaloo.edu/"]
            },
            {
              slug:"university-of-mississippi",
              name:"University of Mississippi",
              home:"https://olemiss.edu/",
              pages:["https://olemiss.edu/marcomm/brand-services/","https://olemiss.edu/"]
            },
            {
              slug:"the-university-of-southern-mississippi",
              name:"The University of Southern Mississippi",
              home:"https://www.usm.edu/",
              pages:["https://www.usm.edu/university-communications/university-logo.php"]
            },
            {
              slug:"william-carey-university",
              name:"William Carey University",
              home:"https://www.wmcarey.edu/",
              pages:["https://www.wmcarey.edu/external-relations/branding","https://www.wmcarey.edu/"]
            }
          ];

          const browser = await chromium.launch({headless:true});
          const manifest = {};

          const keywordsFor = name => name.toLowerCase()
            .replace(/[’']/g,"")
            .split(/[^a-z0-9]+/)
            .filter(w => w.length >= 5 && !["university","college","school","state","southern","mississippi"].includes(w));

          for (const target of targets) {
            const candidates = [];
            const keys = keywordsFor(target.name);
            console.log("\n==", target.name, "==");

            for (const pageUrl of target.pages) {
              const page = await browser.newPage({viewport:{width:1600,height:1200},deviceScaleFactor:3});
              try {
                console.log("Loading", pageUrl);
                await page.goto(pageUrl,{waitUntil:"domcontentloaded",timeout:90000});
                await page.waitForTimeout(4000);

                const found = await page.locator("img, svg").evaluateAll((els,args)=>{
                  const out=[];
                  const {name,keys,pageUrl}=args;
                  const pageLooksBrand=/logo|brand|identity|communication|marketing|visual/i.test(pageUrl);
                  for(let i=0;i<els.length;i++){
                    const el=els[i];
                    const r=el.getBoundingClientRect();
                    const cs=getComputedStyle(el);
                    if(r.width<45||r.height<20||r.width>1400||r.height>900) continue;
                    if(cs.display==="none"||cs.visibility==="hidden"||Number(cs.opacity||1)<.03) continue;

                    const src=el.tagName==="IMG"?(el.currentSrc||el.src||""):"";
                    const alt=el.getAttribute("alt")||"";
                    const cls=typeof el.className==="string"?el.className:(el.className?.baseVal||"");
                    const id=el.id||"";
                    const title=el.getAttribute("title")||"";
                    const parent=(el.closest("a,figure,header,footer,.logo,.brand,.branding,.site-logo,.navbar")?.textContent||"").slice(0,180);
                    const text=[src,alt,cls,id,title,parent].join(" ").toLowerCase();
                    const logoish=/logo|wordmark|logomark|brand|mark|emblem|crest|seal|signature|stacked|vertical|monogram/.test(text);
                    const schoolish=keys.some(w=>text.includes(w)) || name.toLowerCase().split(/\s+/).some(w=>w.length>6&&text.includes(w));
                    if(!logoish) continue;
                    if(!pageLooksBrand && !schoolish) continue;

                    const ratio=r.width/Math.max(1,r.height);
                    let score=1500;
                    if(schoolish) score+=900;
                    if(pageLooksBrand) score+=500;
                    if(/stacked|vertical|compact|logomark|mark only|emblem|monogram/.test(text)) score+=1400;
                    if(/primary/.test(text)) score+=500;
                    if(/seal/.test(text)) score+=250;
                    if(/wordmark|horizontal/.test(text)) score-=350;
                    if(/athletic|sports|mascot|anniversary|accredit|sacscoc|sponsor|partner/.test(text)) score-=2200;
                    if(ratio>=.72&&ratio<=1.38) score+=1800;
                    else if(ratio>=.52&&ratio<=1.75) score+=1050;
                    else if(ratio>=.42&&ratio<=2.05) score+=500;
                    else if(ratio>2.35) score-=900;
                    if(r.width>=120&&r.height>=70) score+=250;

                    out.push({
                      index:i,score,tag:el.tagName,src,alt,cls,id,title,
                      width:r.width,height:r.height,ratio,pageUrl
                    });
                  }
                  return out.sort((a,b)=>b.score-a.score).slice(0,30);
                },{name:target.name,keys,pageUrl});

                for(const c of found) candidates.push({...c,page});
              } catch(e) {
                console.log("Page failed",pageUrl,String(e));
              }
              // Keep page alive until selection/screenshot below.
            }

            candidates.sort((a,b)=>b.score-a.score);
            let saved=false;
            const rejected=[];

            for(const c of candidates){
              try{
                const loc=c.page.locator("img, svg").nth(c.index);
                if(!(await loc.isVisible())) continue;
                await loc.scrollIntoViewIfNeeded();
                await c.page.waitForTimeout(250);
                const png=await loc.screenshot({type:"png"});
                const meta=await sharp(png).metadata();
                const w=meta.width||0,h=meta.height||0;
                if(w<120||h<45) continue;

                // Reject screenshots that are basically empty/blank.
                const stats=await sharp(png).stats();
                const entropy=stats.entropy||0;
                if(entropy<0.25){
                  rejected.push("low entropy "+c.src);
                  continue;
                }

                const out=`study-mississippi/assets/institutions/${target.slug}.webp`;
                await sharp(png)
                  .flatten({background:"#ffffff"})
                  .trim({background:"#ffffff",threshold:8})
                  .resize({width:620,height:620,fit:"inside",withoutEnlargement:false})
                  .webp({quality:94,effort:5})
                  .toFile(out);

                manifest[target.slug]={
                  name:target.name,
                  officialWebsite:target.home,
                  selected:{
                    src:c.src,alt:c.alt,score:c.score,
                    renderedWidth:c.width,renderedHeight:c.height,
                    ratio:c.ratio,page:c.pageUrl
                  },
                  syncedAt:new Date().toISOString()
                };
                console.log("SELECTED",target.name,JSON.stringify(manifest[target.slug].selected));
                saved=true;
                break;
              }catch(e){
                rejected.push(String(e));
              }
            }

            // Close all pages used for this institution.
            for(const p of new Set(candidates.map(c=>c.page))){
              try{await p.close();}catch{}
            }

            if(!saved){
              console.log("No acceptable compact logo found for",target.name,"; keeping existing repo asset.");
              manifest[target.slug]={
                name:target.name,
                officialWebsite:target.home,
                keptExisting:true,
                rejected:rejected.slice(0,5),
                syncedAt:new Date().toISOString()
              };
            }
          }

          await browser.close();
          await fs.writeFile(
            "study-mississippi/assets/institutions/source-manifest.json",
            JSON.stringify(manifest,null,2)+"\n","utf8"
          );
          EOF
          EOF

          cd /tmp/institution-logo-sync
          node sync.mjs

      - name: Commit institution logos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add study-mississippi/assets/institutions
          if git diff --cached --quiet; then
            echo "Institution logos already current."
            exit 0
          fi
          git commit -m "Sync official institution logos"
          git push
