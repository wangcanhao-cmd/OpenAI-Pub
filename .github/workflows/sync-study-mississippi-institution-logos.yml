name: Sync Study Mississippi institution logos

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-study-mississippi-institution-logos.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser and image tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/institution-logo-sync
          cd /tmp/institution-logo-sync
          npm init -y >/dev/null 2>&1
          npm install playwright sharp >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1

      - name: Capture official institution logos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p study-mississippi/assets/institutions

          cat > /tmp/institution-logo-sync/sync.mjs <<'EOF'
          import { chromium } from "playwright";
          import sharp from "sharp";
          import fs from "node:fs/promises";

          process.chdir(process.env.GITHUB_WORKSPACE);

          const targets = [
            ["alcorn-state-university","Alcorn State University","https://www.alcorn.edu/"],
            ["belhaven-university","Belhaven University","https://www.belhaven.edu/"],
            ["blue-mountain-christian-university","Blue Mountain Christian University","https://www.bmc.edu/"],
            ["delta-state-university","Delta State University","https://www.deltastate.edu/"],
            ["jackson-state-university","Jackson State University","https://www.jsums.edu/"],            ["millsaps-college","Millsaps College","https://millsaps.edu/"],            ["mississippi-state-university","Mississippi State University","https://www.msstate.edu/"],
            ["mississippi-university-for-women","Mississippi University for Women","https://www.muw.edu/"],            ["the-piney-woods-school","The Piney Woods School","https://www.pineywoods.org/"],
            ["st-andrews-episcopal-school","St. Andrew's Episcopal School","https://www.gosaints.org/"],
            ["tougaloo-college","Tougaloo College","https://www.tougaloo.edu/"],
            ["university-of-mississippi","University of Mississippi","https://olemiss.edu/"],
            ["the-university-of-southern-mississippi","The University of Southern Mississippi","https://www.usm.edu/"],
            ["william-carey-university","William Carey University","https://www.wmcarey.edu/"]
          ];

          const browser = await chromium.launch({headless:true});
          const manifest = {};

          const keywordScore = (text, name) => {
            const t = (text || "").toLowerCase();
            const n = name.toLowerCase();
            let s = 0;
            if (/logo|wordmark|brand|site[-_ ]?logo/.test(t)) s += 1200;
            if (n.split(/\s+/).filter(w=>w.length>4).some(w=>t.includes(w))) s += 500;
            if (/header|navbar|masthead|branding/.test(t)) s += 300;
            if (/footer/.test(t)) s -= 300;
            if (/icon|social|search|menu|arrow|seal-only|athletic/.test(t)) s -= 250;
            return s;
          };

          for (const [slug,name,url] of targets) {
            const page = await browser.newPage({viewport:{width:1600,height:1000}, deviceScaleFactor:3});
            console.log("Loading", name, url);

            try {
              await page.goto(url,{waitUntil:"domcontentloaded",timeout:90000});
              await page.waitForTimeout(4500);

              const candidates = await page.locator("img, svg").evaluateAll((els, name) => {
                const out = [];
                const norm = s => (s || "").toLowerCase();
                const keywords = name.toLowerCase().split(/\s+/).filter(w=>w.length>4);

                for (let i=0;i<els.length;i++) {
                  const el = els[i];
                  const r = el.getBoundingClientRect();
                  const cs = getComputedStyle(el);
                  if (r.width < 70 || r.height < 22 || r.width > 1100 || r.height > 450) continue;
                  if (cs.display === "none" || cs.visibility === "hidden" || Number(cs.opacity||1) < .05) continue;
                  if (r.width < 1 || r.height < 1) continue;

                  const src = el.tagName === "IMG" ? (el.currentSrc || el.src || "") : "";
                  const alt = el.getAttribute("alt") || "";
                  const cls = typeof el.className === "string" ? el.className : (el.className?.baseVal || "");
                  const id = el.id || "";
                  const aria = el.getAttribute("aria-label") || "";
                  const title = el.getAttribute("title") || "";
                  const parentText = (el.closest("a,header,.header,.site-header,.navbar,.branding")?.textContent || "").slice(0,180);
                  const text = norm([src,alt,cls,id,aria,title,parentText].join(" "));
                  let score = 0;
                  const ratio = r.width / Math.max(1,r.height);
                  if (/logo|brand|site[-_ ]?logo|mark|emblem|crest|seal|monogram/.test(text)) score += 1200;
                  if (/stacked|vertical|compact|mark|emblem|crest|monogram/.test(text)) score += 950;
                  if (/seal/.test(text)) score += 450;
                  if (keywords.some(w=>text.includes(w))) score += 500;
                  if (ratio >= .72 && ratio <= 1.38) score += 1500;
                  else if (ratio >= .52 && ratio <= 1.75) score += 900;
                  else if (ratio >= .42 && ratio <= 2.1) score += 350;
                  else if (ratio > 2.4) score -= 1100;
                  if (/wordmark|horizontal|header[-_ ]?logo/.test(text)) score -= 350;
                  if (/athletic|sports|mascot/.test(text)) score -= 800;
                  if (/icon|social|search|menu|arrow/.test(text)) score -= 700;
                  if (/footer/.test(text)) score -= 150;
                  score += Math.min(280,r.width) + Math.min(180,r.height);

                  out.push({index:i,score,tag:el.tagName,src,alt,cls,id,top:r.top,width:r.width,height:r.height});
                }
                return out.sort((a,b)=>b.score-a.score).slice(0,20);
              }, name);

              if (!candidates.length) throw new Error("No logo-like candidates found");

              let saved = false;
              const errs = [];

              for (const c of candidates) {
                try {
                  const loc = page.locator("img, svg").nth(c.index);
                  if (!(await loc.isVisible())) continue;
                  const png = await loc.screenshot({type:"png"});
                  const meta = await sharp(png).metadata();
                  if ((meta.width||0) < 150 || (meta.height||0) < 40) continue;

                  const out = `study-mississippi/assets/institutions/${slug}.webp`;
                  await sharp(png)
                    .flatten({background:"#ffffff"})
                    .trim({background:"#ffffff",threshold:8})
                    .resize({width:720,height:260,fit:"inside",withoutEnlargement:false})
                    .webp({quality:92,effort:5})
                    .toFile(out);

                  manifest[slug] = {
                    name,
                    officialWebsite:url,
                    sourceElement:c,
                    syncedAt:new Date().toISOString()
                  };
                  console.log(`${name}: selected ${c.tag} ${c.alt || c.src || c.cls || c.id}`);
                  saved = true;
                  break;
                } catch (e) {
                  errs.push(String(e));
                }
              }

              if (!saved) throw new Error("Could not capture logo: "+errs.slice(0,5).join(" | "));
            } catch (e) {
              console.error("FAILED", name, String(e));
              manifest[slug] = {name,officialWebsite:url,error:String(e),syncedAt:new Date().toISOString()};
            } finally {
              await page.close();
            }
          }

          await browser.close();
          await fs.writeFile(
            "study-mississippi/assets/institutions/source-manifest.json",
            JSON.stringify(manifest,null,2)+"\n","utf8"
          );
          EOF

          cd /tmp/institution-logo-sync
          node sync.mjs

      - name: Correct logos from official brand resources
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils >/dev/null

          cat > /tmp/institution-logo-sync/correct.mjs <<'EOF'
          import sharp from "sharp";
          import fs from "node:fs/promises";
          import { execFileSync } from "node:child_process";
          import { chromium } from "playwright";

          process.chdir(process.env.GITHUB_WORKSPACE);

          async function fetchBuffer(url, referer) {
            const res = await fetch(url, {
              headers: {
                "user-agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/136 Safari/537.36",
                "referer":referer || url,
                "accept":"image/avif,image/webp,image/apng,image/svg+xml,image/*,application/pdf,*/*;q=0.8"
              },
              redirect:"follow"
            });
            if (!res.ok) throw new Error(`HTTP ${res.status} for ${url}`);
            return Buffer.from(await res.arrayBuffer());
          }

          async function saveImage(url, out, referer) {
            const b=await fetchBuffer(url,referer);
            await sharp(b,{failOn:"none"})
              .flatten({background:"#ffffff"})
              .trim({background:"#ffffff",threshold:8})
              .resize({width:720,height:260,fit:"inside",withoutEnlargement:false})
              .webp({quality:92,effort:5})
              .toFile(out);
          }

          // Official logo pages provide these exact current assets.
          // Millsaps College: use the official stacked wordmark from the college website.
          await saveImage(
            "https://millsaps.edu/wp-content/uploads/2023/08/millsaps-logo-stacked.png",
            "study-mississippi/assets/institutions/millsaps-college.webp",
            "https://millsaps.edu/"
          );

          await saveImage(
            "https://www.muw.edu/ur/wp-content/uploads/sites/57/2024/01/w-logo_horizontal_blue-1024x259.jpg",
            "study-mississippi/assets/institutions/mississippi-university-for-women.webp",
            "https://www.muw.edu/ur/branding/logos-wordmarks/"
          );
          await saveImage(
            "https://www.usm.edu/university-communications/files/univ_h_123pc.png",
            "study-mississippi/assets/institutions/the-university-of-southern-mississippi.webp",
            "https://www.usm.edu/university-communications/university-logo.php"
          );

          // Delta State: capture the official logo asset rendered in the university header.
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1600,height:1000},deviceScaleFactor:3});
          await page.goto("https://www.deltastate.edu/",{waitUntil:"domcontentloaded",timeout:90000});
          await page.waitForTimeout(5000);

          const deltaCandidates=await page.locator("body *").evaluateAll(els=>{
            const out=[];
            for(let i=0;i<els.length;i++){
              const el=els[i];
              const r=el.getBoundingClientRect();
              if(r.width<70||r.height<20||r.width>1000||r.height>350||r.top>420||r.bottom<0) continue;
              const cs=getComputedStyle(el);
              if(cs.display==="none"||cs.visibility==="hidden"||Number(cs.opacity||1)<.05) continue;
              const before=getComputedStyle(el,"::before");
              const after=getComputedStyle(el,"::after");
              const bg=[cs.backgroundImage,before.backgroundImage,after.backgroundImage].filter(v=>v&&v!=="none").join(" ");
              const txt=[
                el.id||"",
                typeof el.className==="string"?el.className:"",
                el.getAttribute("aria-label")||"",
                el.getAttribute("title")||"",
                bg,
                (el.textContent||"").slice(0,120)
              ].join(" ").toLowerCase();
              let score=0;
              if(/logo|brand|site-logo|header-logo/.test(txt)) score+=1500;
              if(/delta/.test(txt)) score+=700;
              if(/university/.test(txt)) score+=250;
              if(bg.includes("url(")) score+=450;
              if(/header|masthead|navbar/.test(txt)) score+=250;
              if(/footer|icon|social|search|menu/.test(txt)) score-=500;
              score+=Math.max(0,400-r.top);
              score+=Math.min(400,r.width);
              out.push({index:i,score,id:el.id||"",cls:typeof el.className==="string"?el.className:"",bg,top:r.top,width:r.width,height:r.height});
            }
            return out.sort((x,y)=>y.score-x.score).slice(0,30);
          });

          console.log("Delta candidates:",JSON.stringify(deltaCandidates.slice(0,10)));
          let deltaSaved=false;
          for(const c of deltaCandidates){
            try{
              const loc=page.locator("body *").nth(c.index);
              if(!(await loc.isVisible())) continue;
              const png=await loc.screenshot({type:"png"});
              const meta=await sharp(png).metadata();
              if((meta.width||0)<180||(meta.height||0)<45) continue;
              await sharp(png)
                .flatten({background:"#ffffff"})
                .trim({background:"#ffffff",threshold:8})
                .resize({width:720,height:260,fit:"inside",withoutEnlargement:false})
                .webp({quality:92,effort:5})
                .toFile("study-mississippi/assets/institutions/delta-state-university.webp");
              console.log("Delta State selected candidate:",JSON.stringify(c));
              deltaSaved=true;
              break;
            }catch(e){
              console.log("Delta candidate failed:",String(e));
            }
          }
          await page.close();
          await browser.close();
          if(!deltaSaved) throw new Error("Could not capture Delta State official header logo");

          console.log("Corrected MUW, USM, and Delta State logos from official brand resources; pinned compact logos are preserved.");

          EOF

          cd /tmp/institution-logo-sync
          node correct.mjs

      - name: Commit institution logos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add study-mississippi/assets/institutions
          if git diff --cached --quiet; then
            echo "Institution logos already current."
            exit 0
          fi
          git commit -m "Sync official institution logos"
          git push
