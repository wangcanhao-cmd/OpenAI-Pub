name: Deploy public tools to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "oyster-growth-simulator/**"
      - "lutu-card-pool/**"
      - "study-mississippi/**"
      - "airtag-map-demo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build combined site
        run: |
          mkdir -p _site
          cp -R oyster-growth-simulator/. _site/
          mkdir -p _site/lutu-card-pool
          cp -R lutu-card-pool/. _site/lutu-card-pool/
          mkdir -p _site/study-mississippi
          cp -R study-mississippi/. _site/study-mississippi/
          mkdir -p _site/airtag-map-demo
          cp -R airtag-map-demo/. _site/airtag-map-demo/

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Wait for Pages artifact to become available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length' 2>/dev/null || echo 0)
            if [ "$count" = "1" ]; then
              echo "Pages artifact is ready"
              exit 0
            fi
            echo "Artifact not visible yet; retry $attempt"
            sleep 5
          done
          echo "Pages artifact did not become available" >&2
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
