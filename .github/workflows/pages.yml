name: Deploy public tools to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "oyster-growth-simulator/**"
      - "lutu-card-pool/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build combined site
        run: |
          mkdir -p _site
          cp -R oyster-growth-simulator/. _site/
          mkdir -p _site/lutu-card-pool
          cp -R lutu-card-pool/. _site/lutu-card-pool/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
