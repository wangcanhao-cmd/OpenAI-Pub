name: Sync Study Mississippi portrait assets

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sync-study-mississippi-portraits.yml"

permissions:
  contents: write

jobs:
  sync-portraits:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Download original legacy portrait assets
        shell: bash
        run: |
          set -euo pipefail

          original_dir="study-mississippi/assets/people/original"
          processed_dir="study-mississippi/assets/people"
          mkdir -p "$original_dir" "$processed_dir"

          base="https://custom-images.strikinglycdn.com/res/hrscywv4p/image/upload"

          download_original() {
            local out="$1"
            local filename="$2"
            local original_url="$base/1347071/$filename"
            local fallback_url="$base/c_limit,h_2000,w_1600,q_100/1347071/$filename"

            echo "Fetching $filename"
            if ! curl --fail --location --retry 3 --retry-delay 2 \
              --user-agent "Mozilla/5.0" \
              "$original_url" -o "$original_dir/$out"; then
              echo "Original URL failed; falling back to high-quality CDN rendition."
              curl --fail --location --retry 3 --retry-delay 2 \
                --user-agent "Mozilla/5.0" \
                "$fallback_url" -o "$original_dir/$out"
            fi

            test -s "$original_dir/$out"
          }

          download_original "kathie-stromile-golden.jpg" "Golden1.Head_Shot_ghztgw.jpg"
          download_original "petra-marlin-board.jpg" "Petra_Marlin_rpo92i.jpg"
          download_original "hannah-jones.jpg" "20626464_3582774609783_9174128609768154402_o_ires9s.jpg"
          download_original "beth-stapleton.jpg" "Angela_Payne_jeyon2.jpg"
          download_original "angela-payne.jpg" "Dr._Angela_Payne_xj0kxa.jpg"
          download_original "jean-robinson.jpg" "Jean_Robinson_jq49hi.jpg"
          download_original "jason-roberts.jpg" "Jason_Roberts_h4tme1.jpg"
          download_original "petra-marlin-kc.jpg" "Petra_Marlin_iy96ac.jpg"

      - name: Build sharp web portraits from originals
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageFilter

          root = Path("study-mississippi/assets/people")
          src_dir = root / "original"

          files = [
              "kathie-stromile-golden.jpg",
              "petra-marlin-board.jpg",
              "hannah-jones.jpg",
              "beth-stapleton.jpg",
              "angela-payne.jpg",
              "jean-robinson.jpg",
              "jason-roberts.jpg",
              "petra-marlin-kc.jpg",
          ]

          for name in files:
              src = src_dir / name
              dst = root / name

              with Image.open(src) as im:
                  im = ImageOps.exif_transpose(im).convert("RGB")

                  # Preserve the full image. Only reduce extremely large originals;
                  # never enlarge a small source, which would create fake detail.
                  max_side = 1600
                  if max(im.size) > max_side:
                      scale = max_side / max(im.size)
                      new_size = (
                          max(1, round(im.width * scale)),
                          max(1, round(im.height * scale)),
                      )
                      im = im.resize(new_size, Image.Resampling.LANCZOS)

                  # Mild photographic sharpening after resize. This does not synthesize
                  # new facial detail and avoids the softness of the old q_auto CDN copy.
                  im = im.filter(ImageFilter.UnsharpMask(radius=1.0, percent=110, threshold=3))
                  im.save(dst, "JPEG", quality=94, subsampling=0, optimize=True)

                  print(f"{name}: {im.width}x{im.height}")
          PY

      - name: Point About page to local portrait files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("study-mississippi/about.html")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "https://custom-images.strikinglycdn.com/res/hrscywv4p/image/upload/c_limit%2Cfl_lossy%2Ch_1440%2Cw_720%2Cf_auto%2Cq_1/1347071/Golden1.Head_Shot_ghztgw.jpg":
                  "assets/people/kathie-stromile-golden.jpg",
              "https://custom-images.strikinglycdn.com/res/hrscywv4p/image/upload/c_limit%2Cfl_lossy%2Ch_1440%2Cw_720%2Cf_auto%2Cq_1/1347071/Petra_Marlin_rpo92i.jpg":
                  "assets/people/petra-marlin-board.jpg",
              "https://custom-images.strikinglycdn.com/res/hrscywv4p/image/upload/c_limit%2Cfl_lossy%2Ch_1440%2Cw_720%2Cf_auto%2Cq_1/1347071/20626464_3582774609783_9174128609768154402_o_ires9s.jpg":
                  "assets/people/hannah-jones.jpg",
              "https://custom-images.strikinglycdn.com/res/hrscywv4p/image/upload/c_limit%2Cfl_lossy%2Ch_1440%2Cw_720%2Cf_auto%2Cq_1/1347071/Angela_Payne_jeyon2.jpg":
                  "assets/people/beth-stapleton.jpg",
              "https://custom-images.strikinglycdn.com/res/hrscywv4p/image/upload/c_limit%2Cfl_lossy%2Ch_1440%2Cw_720%2Cf_auto%2Cq_1/1347071/Dr._Angela_Payne_xj0kxa.jpg":
                  "assets/people/angela-payne.jpg",
              "https://custom-images.strikinglycdn.com/res/hrscywv4p/image/upload/c_limit%2Cfl_lossy%2Ch_1440%2Cw_720%2Cf_auto%2Cq_1/1347071/Jean_Robinson_jq49hi.jpg":
                  "assets/people/jean-robinson.jpg",
              "https://custom-images.strikinglycdn.com/res/hrscywv4p/image/upload/c_limit%2Cfl_lossy%2Ch_1440%2Cw_720%2Cf_auto%2Cq_1/1347071/Jason_Roberts_h4tme1.jpg":
                  "assets/people/jason-roberts.jpg",
              "https://custom-images.strikinglycdn.com/res/hrscywv4p/image/upload/c_limit%2Cfl_lossy%2Ch_1440%2Cw_720%2Cf_auto%2Cq_1/1347071/Petra_Marlin_iy96ac.jpg":
                  "assets/people/petra-marlin-kc.jpg",
          }

          for old, new in replacements.items():
              text = text.replace(old, new)

          # Add lazy-loading without altering the photos themselves.
          text = text.replace(
              'class="profile-photo" src="assets/people/',
              'class="profile-photo" loading="lazy" decoding="async" src="assets/people/'
          )

          # Bust CSS cache so the current portrait layout is visible immediately.
          text = text.replace('href="styles.css"', 'href="styles.css?v=20261001-portraits-local"')

          path.write_text(text, encoding="utf-8")
          PY

      - name: Record source manifest
        shell: bash
        run: |
          cat > study-mississippi/assets/people/SOURCES.md <<'EOF'
          # Portrait sources

          These portraits were migrated from the legacy MAIE / StudyMississippi
          Strikingly website. The original downloaded files are preserved in
          `assets/people/original/`. The web copies in `assets/people/` are
          generated directly from those originals with only EXIF orientation,
          downscaling when necessary, and mild non-generative sharpening.

          No AI face generation or facial-detail reconstruction is used.

          Legacy source:
          https://maiestudyms.mystrikingly.com/
          EOF

      - name: Commit local portrait assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add study-mississippi/about.html study-mississippi/assets/people
          if git diff --cached --quiet; then
            echo "No portrait changes to commit."
            exit 0
          fi
          git commit -m "Store legacy portrait originals locally and use sharp local copies"
          git push
