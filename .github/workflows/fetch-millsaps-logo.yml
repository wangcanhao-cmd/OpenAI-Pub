name: Fetch Millsaps official logo

on:
  push:
    paths:
      - ".github/workflows/fetch-millsaps-logo.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official Millsaps logo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p study-mississippi/assets/institutions
          curl -L --fail --retry 2 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/136 Safari/537.36" \
            -e "https://millsaps.edu/" \
            "https://millsaps.edu/wp-content/uploads/2023/08/millsaps-logo-stacked.png" \
            -o study-mississippi/assets/institutions/millsaps-college.png
          file study-mississippi/assets/institutions/millsaps-college.png
      - name: Commit logo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add study-mississippi/assets/institutions/millsaps-college.png
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add official Millsaps College logo"
          git push
